[supervisord]
nodaemon=true
user=root

[program:daphne]
# Superviosrd inherits the environment automatically.
# Execute daphne via a quick inline script to ensure PORT drops in cleanly,
# or simply use the python executable path.
command=/bin/bash -c "exec daphne -v 2 -b 0.0.0.0 -p ${PORT:-8000} config.asgi:application"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-worker]
# Run the Celery worker
# Limit concurrency to 1 since Render's Free Tier has only 512MB of RAM
command=celery -A config worker --concurrency=1 --loglevel=info
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-beat]
# Run Celery Beat for scheduled tasks
command=celery -A config beat --loglevel=info
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
