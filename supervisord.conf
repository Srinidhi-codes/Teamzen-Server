[supervisord]
nodaemon=true
user=root

[program:daphne]
# Render injects $PORT dynamically, so we use bash -c to evaluate it
command=bash -c "daphne -b 0.0.0.0 -p ${PORT:-8000} config.asgi:application"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
# Combine Celery Worker and Celery Beat using the -B flag to save memory
# Limit concurrency to 1 since Render's Free Tier has only 512MB of RAM
command=celery -A config worker -B --concurrency=1 --loglevel=info
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
