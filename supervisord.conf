[supervisord]
nodaemon=true
user=root

[program:daphne]
# Superviosrd inherits the environment automatically.
# Execute daphne via a quick inline script to ensure PORT drops in cleanly,
# or simply use the python executable path.
command=/bin/bash -c "exec daphne -v 2 -b 0.0.0.0 -p ${PORT:-8000} config.asgi:application"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-worker]
# Run the Celery worker
# concurrency=1: Render's free tier has limited RAM
# max-tasks-per-child=5: Recycles worker process after 5 tasks to prevent
# LangChain/LangGraph memory leaks accumulating across AI chat requests
command=celery -A config worker --concurrency=1 --max-tasks-per-child=5 --loglevel=warning
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; [program:celery-beat]
; Celery Beat is disabled to reduce memory footprint on constrained instances.
; Re-enable this only on a dedicated worker instance with sufficient RAM (>= 1GB).
; command=celery -A config beat --loglevel=info
; directory=/app
; autostart=true
; autorestart=true
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0
