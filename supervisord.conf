[supervisord]
nodaemon=true
user=root

[program:daphne]
# Daphne ASGI Server - optimized verbosity (-v 1) to conserve buffer memory
command=/bin/bash -c "exec daphne -v 1 -b 0.0.0.0 -p ${PORT:-8000} config.asgi:application"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; [program:mcp-server]
; Disabled on the shared Render web instance to keep memory within limit.
; The AI graph falls back to legacy in-process tools when MCP_ENABLED=false.
; Re-enable this only on a larger instance or separate dedicated service.
; command=python mcp_servers/teamzen_server.py
; directory=/app
; environment=MCP_SERVER_PORT="8001",DJANGO_SETTINGS_MODULE="config.settings"
; autostart=true
; autorestart=true
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0

[program:celery]
# Unified Celery worker with embedded Beat scheduler (-B)
# -P threads -c 1: Thread pool prevents spawning duplicate heavy Python fork processes
# -B: Embeds Celery Beat directly inside the worker process (saves ~130MB by eliminating separate process)
# --without-gossip --without-mingle --without-heartbeat: Eliminates background chatter & socket memory
command=celery -A config worker -B -P threads -c 1 --without-gossip --without-mingle --without-heartbeat --loglevel=warning
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
