services:
  - type: web
    name: payroll-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render injects $PORT automatically; Daphne reads it via ${PORT:-8000}
    # DO NOT set a hardcoded startCommand here — the Dockerfile CMD handles binding.
    envVars:
      - key: PORT
        value: 8000
      - key: DEBUG
        value: "False"
      - key: MCP_ENABLED
        value: "false"
      - key: MCP_SERVER_URL
        value: "http://localhost:8001/mcp"
      # Add remaining env vars via the Render dashboard (secrets)

  # Separate MCP tool server for Cursor / external clients
  - type: web
    name: teamzen-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile.mcp
    envVars:
      - key: DEBUG
        value: "False"
      - key: MCP_AUTH_REQUIRED
        value: "true"
      - key: USE_INMEMORY_CHANNELS
        value: "True"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      # Set DATABASE_URL, SECRET_KEY, OPENAI_API_KEY, ALLOWED_HOSTS in dashboard
