name: Antigravity Auto Fix

on:
  issues:
    types: [opened]

# Grant necessary permissions to create branches, push code, and open PRs
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    # The Toggle: Only runs if you have set a repository variable named AI_AUTO_FIX_ENABLED to 'true'
    if: ${{ vars.AI_AUTO_FIX_ENABLED == 'true' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Antigravity SDK
        run: pip install google-antigravity

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Create working branch
        id: create-branch
        run: |
          BRANCH_NAME="fix/issue-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Run Antigravity Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python .github/scripts/run_antigravity.py

      - name: Push branch and Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Python script above will modify files. We need to stage and commit them.
          git add .
          
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes made by Antigravity."
            exit 0
          fi
          
          git commit -m "Auto-fix #${{ github.event.issue.number }} by Antigravity Agent"
          git push origin ${{ steps.create-branch.outputs.branch_name }}
          
          # Use GitHub CLI to create the Pull Request
          gh pr create \
            --title "Fix #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" \
            --body "Automated fix for issue #${{ github.event.issue.number }} generated by the Antigravity Agent. Please review." \
            --base main \
            --head ${{ steps.create-branch.outputs.branch_name }}
