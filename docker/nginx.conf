# ─────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy — Production-Grade Configuration
# Features: Gzip compression, static caching, rate limiting, security headers,
#           WebSocket support, connection keepalive, load balancing ready
# ─────────────────────────────────────────────────────────────────────────────

# Worker tuning — auto-detect CPU cores
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── Basic Settings ──────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Performance: sendfile + tcp optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;           # Hide nginx version

    # Timeouts
    keepalive_timeout   65;
    keepalive_requests  1000;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout        30s;

    # Buffer sizes
    client_max_body_size    50M;
    client_body_buffer_size 128k;
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # ── Gzip Compression ────────────────────────────────────────────────────
    # Reduces response size by 60-80% for text content
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ── Rate Limiting ───────────────────────────────────────────────────────
    # Protects API from abuse. 10 requests/second per IP with burst of 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=graphql_limit:10m rate=20r/s;
    limit_req_status 429;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstream Definitions ────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;              # Persistent connections to backend
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── Proxy Cache (optional, for API response caching) ────────────────────
    proxy_cache_path /tmp/nginx_cache
        levels=1:2
        keys_zone=api_cache:10m
        max_size=100m
        inactive=60m
        use_temp_path=off;

    # ── Server Block ────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ── Security Headers ────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Backend API ─────────────────────────────────────────────────────
        location /api/auth/ {
            # Stricter rate limit for auth endpoints (login, register, refresh)
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            # Cache GET responses for 30 seconds (optional, remove if not wanted)
            # proxy_cache api_cache;
            # proxy_cache_valid 200 30s;
            # proxy_cache_methods GET HEAD;
            # add_header X-Cache-Status $upstream_cache_status;
        }

        # ── GraphQL Endpoint ────────────────────────────────────────────────
        location /graphql/ {
            limit_req zone=graphql_limit burst=30 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            # Larger buffer for GraphQL responses
            proxy_buffer_size       256k;
            proxy_buffers           8 512k;
            proxy_busy_buffers_size 512k;
        }

        # ── WebSocket Support (Notifications) ───────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long timeout for persistent WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Django Admin ────────────────────────────────────────────────────
        location /admin/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # ── MCP Endpoint ────────────────────────────────────────────────────
        location /mcp/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # ── Static Files (WhiteNoise serves these, Nginx caches) ────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Health Check Endpoint ───────────────────────────────────────────
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ── Frontend (catch-all) ────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js HMR WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Error Pages ─────────────────────────────────────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
