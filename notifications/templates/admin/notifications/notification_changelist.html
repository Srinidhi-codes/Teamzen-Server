{% extends "admin/change_list.html" %}
{% load i18n %}
{% block object-tools %}
<div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px;">
    <h3 style="margin-top: 0;">Test Email Settings</h3>
    <form action="test-email/" method="POST" style="display: flex; align-items: center; gap: 10px;">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Recipient Email Address" required style="padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px;">
        <button type="submit" style="padding: 8px 16px; background: #4F46E5; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Send Test Email</button>
    </form>
</div>
{{ block.super }}
{% endblock %}
